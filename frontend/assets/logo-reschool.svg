<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <defs>
    <linearGradient id="fullLeafGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="fullBookGrad" x1="10%" y1="15%" x2="90%" y2="85%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <linearGradient id="fullSparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>
  </defs>

  <!-- Logo Mark Icon on Left (48x48) -->
  <g transform="translate(6, 6)">
    <!-- Base squircle -->
    <rect width="48" height="48" rx="14" fill="url(#iconBg)" stroke="#CBD5E1" stroke-width="1" />

    <!-- Scaled inner vectors (0.4 multiplier from 120 base) -->
    <g transform="translate(0, 0) scale(0.4)">
      <!-- Circulation Loop -->
      <path d="M34 68 C25 56 28 38 42 30 C56 22 68 34 60 48" 
            stroke="url(#fullLeafGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M86 52 C95 64 92 82 78 90 C64 98 52 86 60 72" 
            stroke="url(#fullBookGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Left Page -->
      <path d="M60 76 C52 70 38 68 28 72 C28 54 38 50 54 52 C57 52.5 59 54 60 56 Z" 
            fill="url(#fullLeafGrad)" />
      <!-- Right Page -->
      <path d="M60 76 C68 70 82 68 92 72 C92 54 82 50 66 52 C63 52.5 61 54 60 56 Z" 
            fill="url(#fullBookGrad)" />
      <!-- Spine -->
      <path d="M60 52 L60 84" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

      <!-- Sprout spark -->
      <path d="M60 26 C60 26 54 34 54 39 C54 42.3 56.7 45 60 45 C63.3 45 66 42.3 66 39 C66 34 60 26 60 26 Z" 
            fill="url(#fullSparkGrad)" />
      <circle cx="60" cy="38" r="2.5" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(64, 15)">
    <!-- "Re" in Royal Blue / Deep Navy -->
    <text x="0" y="21" font-family="'Plus Jakarta Sans', 'Be Vietnam Pro', -apple-system, sans-serif" font-size="24" font-weight="800" fill="#1E293B" letter-spacing="-0.5px">Re<tspan fill="#059669">school</tspan></text>
    <!-- Accent leaf above dot -->
    <circle cx="98.5" cy="4" r="2.5" fill="#10B981" />
    
    <!-- Tagline: "HỌC ĐƯỜNG TUẦN HOÀN" -->
    <text x="1" y="34" font-family="'Be Vietnam Pro', sans-serif" font-size="8" font-weight="700" fill="#0D9488" letter-spacing="1.2px">HỌC ĐƯỜNG TUẦN HOÀN</text>
  </g>
</svg>
